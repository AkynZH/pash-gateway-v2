version: '3.9'

services:

  # ── PASH Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:        production
      PORT:            3000
      DATABASE_URL:    postgres://pash:pash@postgres:5432/pash_gateway
      REDIS_URL:       redis://redis:6379
      OPENROUTER_API_KEY:  ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY:      ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY:-}
      PASH_PROMPT_LANG:    ru
      PASH_PROMPT_MODE:    pash
      CB_PROVIDER_CHAIN:   openrouter,openai,anthropic
      CORS_ORIGIN:         ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       pash_gateway
      POSTGRES_USER:     pash
      POSTGRES_PASSWORD: pash
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U pash -d pash_gateway"]
      interval: 5s
      timeout:  3s
      retries:  10
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
